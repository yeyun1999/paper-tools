[project]
name = "paper-search-plugin-template"
version = "0.1.0"
description = "Template for paper-search plugins: minimal Searcher + MetadataProvider with optional role skeletons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["paper-search"]

# 每个角色一个 entry-point group；同一个类可注册进多个 group（多角色）。
[project.entry-points."paper_search.searchers"]
example = "paper_search_example.searcher:ExampleSearcher"

[project.entry-points."paper_search.metadata"]
example = "paper_search_example.metadata:ExampleMetadata"

# 可选角色骨架：实现 skeletons.py 后取消注释
# [project.entry-points."paper_search.locators"]
# example = "paper_search_example.skeletons:ExampleLocator"
# [project.entry-points."paper_search.downloaders"]
# example = "paper_search_example.skeletons:ExampleDownloader"
# [project.entry-points."paper_search.extractors"]
# example = "paper_search_example.skeletons:ExampleExtractor"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_search_example"]

# 本地开发：依赖同仓库的 paper-search 主包（editable）。
# 主包发布 PyPI 后删除本段，改为普通版本约束。
[tool.uv.sources]
paper-search = { path = "../", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]  # 中文文档字符串/注释允许全角标点