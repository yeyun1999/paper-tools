name: Release

# Publishes the main distribution (paper-tools-cli) to PyPI via OIDC trusted
# publishing, so no credential is stored in this repository.
# Triggers: pushing a v<semver> tag, or publishing a GitHub Release. The version always
# comes from pyproject.toml, and the tag must equal v<that version>. A version already
# present on PyPI is skipped instead of failing, so the release event that follows our
# own tag push (or a forgotten version bump) is a no-op rather than a red run.
# Plugin packages (paper-tools-biorxiv, paper-tools-plugin-template) are separate
# distributions and out of scope here.
on:
  push:
    tags:
      - "v[0-9]*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  build:
    name: Build and validate artifacts
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-publish: ${{ steps.dup.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: astral-sh/setup-uv@v5

      - name: Resolve version from pyproject.toml
        id: version
        run: |
          set -euo pipefail
          version="$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ -z "$version" ]; then
            echo "::error::could not read project.version from pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"

      - name: Tag must match the resolved version
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match v$VERSION from pyproject.toml"
            exit 1
          fi

      - name: Detect whether this version still needs publishing
        id: dup
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/paper-tools-cli/$VERSION/json")"
          if [ "$code" = "200" ]; then
            echo "::notice::paper-tools-cli $VERSION is already on PyPI; skipping publish"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sdist and wheel
        if: steps.dup.outputs.should_publish == 'true'
        run: uv build

      - name: Check distribution metadata
        if: steps.dup.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          uv run --with twine twine check dist/*
          uv run --no-project DIST_VERSION="$VERSION" python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          expected_version = os.environ["DIST_VERSION"]
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              metadata = next(
                  archive.read(name).decode()
                  for name in archive.namelist()
                  if name.endswith("METADATA")
              )
          fields = {}
          for line in metadata.splitlines():
              if ": " in line:
                  key, value = line.split(": ", 1)
                  fields.setdefault(key, value)
          for key in ("Name", "Version", "License-Expression", "Requires-Python"):
              if key not in fields:
                  raise SystemExit(f"missing metadata field: {key}")
          if fields["Name"] != "paper-tools-cli":
              raise SystemExit(f"unexpected distribution name: {fields['Name']}")
          if fields["Version"] != expected_version:
              raise SystemExit(f"wheel version {fields['Version']} != {expected_version}")
          if not any(Path("dist").glob("*.tar.gz")):
              raise SystemExit("sdist is missing")
          print(f"ready to publish: {fields['Name']} {fields['Version']}")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        if: steps.dup.outputs.should_publish == 'true'
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: needs.build.outputs.should-publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paper-tools-cli/${{ needs.build.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-directory: dist
          print-response: false

  verify:
    name: Smoke test the published package
    if: needs.build.outputs.should-publish == 'true'
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@v5

      - name: Wait for the release to appear on PyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/paper-tools-cli/$VERSION/json"
          for _ in $(seq 1 30); do
            live="$(curl -fsS "$url" 2>/dev/null \
              | uv run --no-project python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])' \
              2>/dev/null || true)"
            if [ "$live" = "$VERSION" ]; then
              echo "PyPI serves $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url did not become visible in time"
          exit 1

      - name: Install from PyPI and run the CLI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          uv tool run --from "paper-tools-cli==$VERSION" paper-tools --version \
            | grep -Fx "paper-tools $VERSION"
          uv tool run --from "paper-tools-cli==$VERSION" paper-tools sources --json \
            | grep -F '"schema_version": "1.1"'
